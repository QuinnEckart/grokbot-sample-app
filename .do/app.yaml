name: grokbot-sample-app
region: nyc
services:
  - name: web
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    source_dir: /
    run_command: npm start
    git:
      repo_clone_url: https://github.com/QuinnEckart/grokbot-sample-app.git
      branch: main
    health_check:
      http_path: /healthz
    envs:
      - key: MODEL_ACCESS_KEY
        value: REPLACE_WITH_YOUR_MODEL_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
